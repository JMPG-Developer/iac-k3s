# Variables de configuración para el servidor hades
# Los valores sensibles están en vault.yml

k3s_apps:
  - name: cloudflared
    enabled: true
    values:
      cloudflared_tunnel_token: "{{ vault_cloudflared_tunnel_token }}"
  - name: postgres
    enabled: true
    values:
      postgres_password: "{{ vault_postgres_password_hades }}"
  - name: github_runner
    enabled: false
  - name: cert_manager
    enabled: false
