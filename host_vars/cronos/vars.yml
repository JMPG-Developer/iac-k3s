# Variables de configuración para el servidor cronos
# Los valores sensibles están en vault.yml

cloudflared_tunnel_token: "{{ vault_cloudflared_tunnel_token }}"

# Runners de GitHub Actions (role github_runner).
# Los registration tokens caducan ~1h: regenerar en GitHub (Settings → Actions
# → Runners → New self-hosted runner) y actualizar el vault justo antes de
# ejecutar el playbook.
github_runners:
  - name: k3s-runner-jmpg-developer
    scope: org
    target: JMPG-Developer
    token: "{{ vault_github_runner_token }}"
  - name: k3s-runner-portal
    scope: repo
    target: jmpgdev/portal
    token: "{{ vault_github_runner_portal_token }}"
    deploy_namespaces:
      - portal
