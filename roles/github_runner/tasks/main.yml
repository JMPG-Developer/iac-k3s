---
- name: Obtener access token de GitHub en el control node
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - gh
      - auth
      - token
  register: github_runner_access_token_result
  changed_when: false

- name: Guardar access token de GitHub
  ansible.builtin.set_fact:
    github_runner_access_token: "{{ github_runner_access_token_result.stdout | trim }}"

- name: Aplicar manifiestos de github-runner
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig }}"
    state: present
    definition: "{{ lookup('template', 'deploy.yaml.j2') | from_yaml_all | list }}"
