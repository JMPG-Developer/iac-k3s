---
github_runner_namespace: github-runner
github_runner_image: myoung34/github-runner:latest
github_runner_dind_image: docker:dind

# Lista de runners a desplegar. Cada entrada:
#   name: nombre del runner (y del Deployment/Secret asociados)
#   scope: org | repo
#   target: nombre de la organización, o owner/repo si scope=repo
#   token: registration token (se resuelve fresco en cada despliegue)
#   deploy_namespaces: namespaces donde el runner puede desplegar via kubectl
#     (crea ServiceAccount + Role/RoleBinding limitados a esos namespaces)
github_runners: []
