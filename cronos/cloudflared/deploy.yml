apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-secret
  namespace: cloudflared
type: Opaque
stringData:
  TUNNEL_TOKEN: "eyJhIjoiMjc3OGEwMzM2ZDM4ZjZlN2UzYTBkMjliZGEyMTI4NGMiLCJ0IjoiNTgxYjVmNTItZGRjYS00Nzc3LWFjYjYtN2EyM2QwOWE3NDA4IiwicyI6Ik56WmhZMll4WldJdE5ERTRNeTAwWlRjMExUZ3dPR1V0TW1VM1pqSmpabVZsT0RreCJ9"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-deployment
  namespace: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - "tunnel"
        - "--no-autoupdate"
        - "run"
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-secret
              key: TUNNEL_TOKEN