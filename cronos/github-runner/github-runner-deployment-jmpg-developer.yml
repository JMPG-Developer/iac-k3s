apiVersion: v1
kind: Namespace
metadata:
  name: github-runner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner-deployment-jmpg-developer
  namespace: github-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner-jmpg-developer
  template:
    metadata:
      labels:
        app: github-runner-jmpg-developer
    spec:
      containers:
      - name: runner
        image: summerwind/actions-runner:latest
        env:
        - name: RUNNER_NAME
          value: "k3s-runner-jmpg-developer"
        - name: RUNNER_ORG
          value: "JMPG-Developer"
        - name: RUNNER_TOKEN
          value: "ABRH6IXO2WR3VJ5TJGNZEFDKL5Z3G"  # ◄ Asegúrate de que este token siga siendo válido en GitHub
        - name: DOCKER_HOST
          value: "tcp://localhost:2375"
        volumeMounts:
        - name: runner-storage
          mountPath: /runner
      - name: dind
        image: docker:dind
        args: ["--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]
        securityContext:
          privileged: true
        env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
      volumes:
      - name: runner-storage
        emptyDir: {}