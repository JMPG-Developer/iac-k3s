name: Generar CHANGELOG

on:
  push:
    branches:
      - main
    paths-ignore:
      - CHANGELOG.md
      - README.md
      - .github/workflows/changelog.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    name: Generar y actualizar CHANGELOG

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar conventional-changelog
        run: |
          npm install -g conventional-changelog-cli
          npm install -g conventional-changelog-conventionalcommits

      - name: Generar CHANGELOG
        run: |
          if [ -f CHANGELOG.md ]; then
            conventional-changelog -p conventionalcommits -r 2 -i CHANGELOG.md
          else
            conventional-changelog -p conventionalcommits -i CHANGELOG.md -s
          fi

      - name: Verificar cambios
        id: verify
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Hacer commit y push
        if: steps.verify.outputs.changes == 'true'
        run: |
          git add CHANGELOG.md
          git commit -m "chore: actualizar CHANGELOG" -m "Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push origin main

      - name: Crear comentario en PR (si aplica)
        if: github.event_name == 'pull_request' && steps.verify.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📝 **CHANGELOG actualizado automáticamente**\n\nEste PR generará cambios en el CHANGELOG al hacer merge a main.'
            })
